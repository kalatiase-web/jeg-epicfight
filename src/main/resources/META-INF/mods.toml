version="${mod_version}"
displayName="Epic Fight Mob Stripper"
description='''
Removes Epic Fight's movesets from vanilla mobs so Better Combat (via Better Mob Combat) can
animate them instead, while leaving bosses and the player on Epic Fight. Configurable.
'''

[[dependencies.${mod_id}]]
