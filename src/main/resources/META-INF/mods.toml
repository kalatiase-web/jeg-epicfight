    mandatory=true
    versionRange="[1.20.1,1.21)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="epicfight"
    mandatory=true
    versionRange="[20.9,)"
    ordering="AFTER"
    side="BOTH"
