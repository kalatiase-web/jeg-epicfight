plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.spongepowered.mixin' version '0.7.+'
}

version = "${mod_version}+mc${minecraft_version}"
group = 'com.bcplayeroff'
base { archivesName = "bcplayeroff" }
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: minecraft_version
    copyIdeResources = true
    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'debug'
            arg '-mixin.config=bcplayeroff.mixins.json'
            mods { bcplayeroff { source sourceSets.main } }
        }
        client { }
    }
}

mixin {
    add sourceSets.main, 'bcplayeroff.refmap.json'
    config 'bcplayeroff.mixins.json'
}

repositories {
    mavenCentral()
    maven { name = 'MinecraftForge'; url = 'https://maven.minecraftforge.net/' }
    exclusiveContent {
        forRepository { maven { name = 'Modrinth'; url = 'https://api.modrinth.com/maven' } }
        forRepositories(fg.repository)
        filter { includeGroup 'maven.modrinth' }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    implementation fg.deobf("maven.modrinth:epic-fight:${epicfight_version}")
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

tasks.named('processResources', ProcessResources).configure {
    def props = [mod_id: mod_id, mod_version: project.version]
    inputs.properties props
    filesMatching(['META-INF/mods.toml']) { expand props }
}

tasks.named('jar', Jar).configure {
    manifest { attributes(['MixinConfigs': 'bcplayeroff.mixins.json']) }
    finalizedBy 'reobfJar'
}
