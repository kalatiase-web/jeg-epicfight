name: build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.1.1'

      - name: Build
        run: gradle build --no-daemon --stacktrace

      - name: Upload jar
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jeg-epicfight-jar
          path: build/libs/*.jar
          if-no-files-found: warn

      - name: Publish jar to dist branch
        if: success() && github.ref == 'refs/heads/main'
        run: |
          JAR=$(ls build/libs/*.jar | grep -v -- '-sources' | head -1)
          echo "Publishing $JAR"
          mkdir -p /tmp/dist && cp "$JAR" /tmp/dist/
          cd /tmp/dist
          git init -q
          git config user.email "actions@github.com"
          git config user.name "github-actions"
          git checkout -q -b dist
          git add -A
          git commit -q -m "Build from ${GITHUB_SHA::7}"
          git push -q --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" dist
