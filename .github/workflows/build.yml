name: build-hydrological

on:
  push:
    branches: [ hydrological ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '7.3'

      - name: Vendor databuddy out of the published Hydrological jar
        run: |
          set -euo pipefail
          # commoble.net/maven (databuddy's only published home) is unreachable, so take the copy
          # the mod author already bundles inside the release jar via jarJar.
          mkdir -p /tmp/vendor && cd /tmp/vendor
          curl -fsSL -o hydrological.jar "https://api.modrinth.com/maven/maven/modrinth/hydrological/0.15.3/hydrological-0.15.3.jar"
          unzip -o -q hydrological.jar 'META-INF/jarjar/*' -d extracted
          echo "Bundled jars:"
          ls -la extracted/META-INF/jarjar/
          DB=$(ls extracted/META-INF/jarjar/databuddy*.jar | head -1)
          echo "Using $DB"
          DEST="$GITHUB_WORKSPACE/localmaven/commoble/databuddy/databuddy-1.20.1/4.0.0.0"
          mkdir -p "$DEST"
          cp "$DB" "$DEST/databuddy-1.20.1-4.0.0.0.jar"
          POM="$DEST/databuddy-1.20.1-4.0.0.0.pom"
          printf '%s\n' '<?xml version="1.0" encoding="UTF-8"?>' > "$POM"
          printf '%s\n' '<project xmlns="http://maven.apache.org/POM/4.0.0">' >> "$POM"
          printf '%s\n' '  <modelVersion>4.0.0</modelVersion>' >> "$POM"
          printf '%s\n' '  <groupId>commoble.databuddy</groupId>' >> "$POM"
          printf '%s\n' '  <artifactId>databuddy-1.20.1</artifactId>' >> "$POM"
          printf '%s\n' '  <version>4.0.0.0</version>' >> "$POM"
          printf '%s\n' '  <packaging>jar</packaging>' >> "$POM"
          printf '%s\n' '</project>' >> "$POM"
          ls -la "$DEST"

      - name: Build
        run: gradle build --no-daemon --stacktrace

      - name: Upload jar
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hydrological-jar
          path: build/libs/*.jar
          if-no-files-found: warn

      - name: Publish jar to hydrological-dist branch
        if: success()
        run: |
          JAR=$(ls build/libs/*.jar | grep -v -- '-sources' | grep -v -- '-slim' | head -1)
          echo "Publishing $JAR"
          mkdir -p /tmp/dist && cp "$JAR" /tmp/dist/hydrological-0.15.3-faster.jar
          cd /tmp/dist
          git init -q
          git config user.email "actions@github.com"
          git config user.name "github-actions"
          git checkout -q -b hydrological-dist
          git add -A
          git commit -q -m "Build from ${GITHUB_SHA::7}"
          git push -q --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" hydrological-dist
